[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostscan"
version = "0.1.0"
description = "Fast, dependency-free async TCP port scanner with banner grabbing and JSON/CSV export."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "port-scanner", "asyncio", "recon", "pentest", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Environment :: Console",
]

[project.scripts]
ghostscan = "ghostscan.cli:main"

[tool.setuptools]
packages = ["ghostscan"]
